# Blueprint do Render para o MediAgenda (plano Free).
# Documentação: https://render.com/docs/blueprint-spec
#
# O serviço já existe e está publicado em https://mediagenda-0za9.onrender.com
# (criado a partir deste repositório, região Oregon). Este ficheiro serve de
# referência: recriar o serviço com um Blueprint criaria uma segunda instância,
# porque o nome "mediagenda" já está em uso.
services:
  - type: web
    name: mediagenda
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 24.14.0
      - key: NODE_ENV
        value: production
      # Para persistir a base de dados entre deploys é preciso um disco
      # (só disponível em planos pagos). Descomenta quando tiveres disco:
      # - key: MEDIAGENDA_DB
      #   value: /var/data/mediagenda.db
